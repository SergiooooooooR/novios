<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En su memoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E3DAC9;
    --paper:#E3DAC9;
    --paper-dark:#E3DAC9;
    --sepia:#E3DAC9;
    --maroon:#000000;
    --maroon-dark:#54202F;
    --ink:#3A2A22;
    --gold:#B8873D;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body.locked{
    overflow:hidden;
    height:100vh;
  }

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:18px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    line-height:1.2;
  }

  .signature{
    font-family:'Parisienne', cursive;
    font-weight:400;
  }

  section{
    position:relative;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:56px 26px;
    text-align:center;
    overflow:hidden;
  }

  .corner-flourish{
    position:absolute;
    width:96px;
    height:96px;
    opacity:.55;
    pointer-events:none;
  }
  .corner-flourish.tl{ top:18px; left:12px; }
  .corner-flourish.br{ bottom:18px; right:12px; transform:rotate(180deg); }

  /* ---------- INICIO ---------- */
  #inicio{
    background:
      radial-gradient(circle at 50% 15%, rgba(255,255,255,.5), transparent 60%),
      var(--paper);
  }

  .memoria-eyebrow{
    font-size:20px;
    font-style:italic;
    color:var(--maroon);
    max-width:300px;
    margin-bottom:3px;
  }

  .memoria-eyebrow.reveal{
    margin-top:1px;
    margin-bottom:0;
    opacity:0;
    transition:opacity .1s linear;
  }

  .swipe-frame{
    position:relative;
    width:min(280px, 69vw);
    aspect-ratio:3/4;
    border-radius:4px;
    overflow:hidden;
    border:9px solid #fff;
    box-shadow:0 20px 44px rgba(58,42,34,.28);
    cursor:grab;
    touch-action:none;
    transition:opacity .5s ease;
  }

  .swipe-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }

  .swipe-veil{
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(58,42,34,.35), transparent 55%);
    pointer-events:none;
  }

  .swipe-hint{
    margin-top:-10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:20px;
    letter-spacing:.04em;
    color:var(--maroon);
    opacity:.85;
    transition:opacity .1s linear;
  }

  .swipe-hint .chevron{
    font-size:30px;
    line-height:1;
    animation:bob 1.6s ease-in-out infinite;
  }

  @keyframes bob{
    0%, 100%{ transform:translateY(0); opacity:.5; }
    50%{ transform:translateY(-8px); opacity:1; }
  }

  #inicio.done .memoria-eyebrow,
  #inicio.done .swipe-hint{ opacity:0; transition:opacity .5s ease; pointer-events:none; }

  /* ---------- ALBUM ---------- */
  #album{ background:var(--cream); }

  .album-note{
    font-size:22px;
    font-style:italic;
    color:var(--maroon);
    max-width:340px;
    margin-bottom:28px;
  }

  .carousel{
    position:relative;
    width:min(300px, 80vw);
    aspect-ratio:4/5;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(58,42,34,.24);
    border:6px solid #fff;
  }

  .carousel-track{
    display:flex;
    height:100%;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
  }

  .carousel-track img{
    width:100%;
    height:100%;
    object-fit:cover;
    flex:0 0 100%;
  }

  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,.88);
    border:none;
    color:var(--maroon);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .carousel-arrow.prev{ left:10px; }
  .carousel-arrow.next{ right:10px; }

  .carousel-dots{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .carousel-dots span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--paper-dark);
    transition:background .2s ease, transform .2s ease;
  }
  .carousel-dots span.active{
    background:var(--maroon);
    transform:scale(1.25);
  }

  .scroll-hint{
    margin-top:40px;
    font-size:13px;
    color:var(--maroon);
    opacity:.7;
  }

  /* ---------- DEDICATORIA (marco floral) ---------- */
  #dedicatoria{ background:var(--paper); }

  #dedicatoria h2{
    font-size:clamp(24px, 5vw, 32px);
    font-style:italic;
    color:var(--maroon-dark);
    margin-bottom:8px;
  }

  .dedic-hint{
    font-size:14px;
    color:var(--maroon);
    opacity:.8;
    margin-bottom:26px;
  }

  .floral-frame{
    position:relative;
    width:min(320px, 86vw);
    min-height:260px;
    border-radius:6px;
    cursor:pointer;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(58,42,34,.24);
    background:var(--cream);
  }

  .dedic-text{
    position:relative;
    z-index:1;
    padding:40px 28px;
    font-size:19px;
    line-height:1.75;
    color:var(--ink);
  }

  .floral-half{
    position:absolute;
    top:0;
    bottom:0;
    width:50%;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    transition:transform .7s cubic-bezier(.22,1,.36,1);
  }
  .floral-half.left{ left:0; border-right:1px solid var(--gold); }
  .floral-half.right{ right:0; border-left:1px solid var(--gold); }
  .floral-half svg{ width:70%; height:70%; opacity:.9; }
  .floral-half.right svg{ transform:scaleX(-1); }

  .floral-frame.open .floral-half.left{ transform:translateX(-100%); }
  .floral-frame.open .floral-half.right{ transform:translateX(100%); }

  /* ---------- CIERRE ---------- */
  #cierre{ background:var(--cream); }

  .cierre-photo{
    width:min(270px, 76vw);
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    border:9px solid #fff;
    box-shadow:0 18px 40px rgba(58,42,34,.26);
    margin-bottom:30px;
  }

  .cierre-note{
    max-width:360px;
    font-size:18px;
  }

  .cierre-farewell{
    margin-top:20px;
    font-size:20px;
    font-style:italic;
    color:var(--maroon);
  }

  .save-btn{
    margin-top:36px;
    background:var(--maroon);
    color:#fff;
    border:none;
    padding:14px 34px;
    border-radius:999px;
    font-family:'EB Garamond', serif;
    font-size:17px;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(110,42,61,.32);
    transition:transform .15s ease, background .2s ease;
  }
  .save-btn:active{ transform:scale(.96); }
  .save-btn.saved{ background:var(--maroon-dark); }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--cream);
    padding:10px 22px;
    border-radius:999px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body class="locked">

  <!-- ============ 1. INICIO ============ -->
  <section id="inicio">
    <div class="corner-flourish tl"></div>
    <div class="corner-flourish br"></div>
    <p class="memoria-eyebrow" id="fraseInicio1"></p>
    <div class="swipe-frame" id="swipeFrame">
      <img id="portadaFoto" src="" alt="Foto de portada">
      <div class="swipe-veil"></div>
    </div>
    <p class="memoria-eyebrow reveal" id="fraseInicio2"></p>
    <div class="swipe-hint" id="swipeHint">
      <span class="chevron">⌃</span>
      <span>Desliza hacia arriba</span>
    </div>
  </section>

  <!-- ============ 2. ALBUM ============ -->
  <section id="album">
    <div class="corner-flourish tl"></div>
    <div class="corner-flourish br"></div>
    <p class="album-note" id="albumNota"></p>
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow prev" id="carPrev">‹</button>
      <button class="carousel-arrow next" id="carNext">›</button>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
    <p class="scroll-hint">Sigue bajando ↓</p>
  </section>

  <!-- ============ 3. DEDICATORIA (marco floral) ============ -->
  <section id="dedicatoria">
    <div class="corner-flourish tl"></div>
    <div class="corner-flourish br"></div>
    <h2>Su recuerdo vive</h2>
    <p class="dedic-hint">Toca el marco para abrirlo</p>
    <div class="floral-frame" id="floralFrame">
      <div class="dedic-text" id="dedicText"></div>
      <div class="floral-half left" id="floralLeft"></div>
      <div class="floral-half right" id="floralRight"></div>
    </div>
  </section>

  <!-- ============ 4. CIERRE ============ -->
  <section id="cierre">
    <div class="corner-flourish tl"></div>
    <div class="corner-flourish br"></div>
    <img class="cierre-photo" id="cierreFoto" src="" alt="Foto familiar">
    <p class="cierre-note" id="cierreTexto"></p>
    <p class="cierre-farewell" id="cierreDespedida"></p>
    <button class="save-btn" id="saveBtn">Guardar este recuerdo</button>
  </section>

  <div class="toast" id="toast">Enlace copiado</div>

<script>
/* =========================================================
   CONFIGURA AQUÍ LOS DATOS DE CADA CLIENTE
   (esta es la única sección que cambia por cliente)
   ========================================================= */

if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0, 0);
window.addEventListener('load', () => window.scrollTo(0, 0));
window.addEventListener('pageshow', () => window.scrollTo(0, 0));

const CONFIG = {
  fraseInicio1: "HAY PERSONAS QUE NUNCA SE VAN DEL TODO.",
  fraseInicio2: "Solo cambian de forma para seguir cerca.",

  portadaFoto: "imag/1.png",

  albumNota: "Algunos de los momentos que atesoramos contigo.",
  fotos: [
    "imag/2.png",
    "imag/3.png",
    "imag/4.png",
    "imag/5.png"
  ],

  dedicatoria: "Aunque ya no estés físicamente, tu presencia sigue en cada risa, en cada recuerdo compartido y en cada enseñanza que dejaste marcada en nosotros. Hoy y siempre, te llevamos con nosotros.",

  cierreFoto: "imag/6.png",
  cierreTexto: "Cuánto te extrañamos. Tu recuerdo, tus enseñanzas y tu amor quedan plasmados para toda la vida en este pequeño espacio que hicimos pensando en ti.",
  cierreDespedida: "Con todo nuestro cariño, hasta siempre."
};

/* =========================================================
   LÓGICA — no necesitas tocar nada de aquí para abajo
   ========================================================= */

// ---- Textos y fotos dinámicos ----
document.getElementById('fraseInicio1').textContent = CONFIG.fraseInicio1;
document.getElementById('fraseInicio2').textContent = CONFIG.fraseInicio2;
document.getElementById('portadaFoto').src = CONFIG.portadaFoto;
document.getElementById('albumNota').textContent = CONFIG.albumNota;
document.getElementById('dedicText').textContent = CONFIG.dedicatoria;
document.getElementById('cierreFoto').src = CONFIG.cierreFoto;
document.getElementById('cierreTexto').textContent = CONFIG.cierreTexto;
document.getElementById('cierreDespedida').textContent = CONFIG.cierreDespedida;

// ---- Ornamento floral (se repite en las esquinas de cada sección) ----
const FLOURISH = `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M6 114C6 114 32 98 36 72C40 46 22 32 22 32" stroke="#B8873D" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 32C22 32 36 38 42 28C48 18 42 6 42 6" stroke="#B8873D" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="6" r="5" fill="#6E2A3D"/>
  <circle cx="22" cy="32" r="4" fill="#B8873D" opacity=".75"/>
  <path d="M36 72C36 72 50 68 54 56" stroke="#B8873D" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="56" r="4.5" fill="#6E2A3D" opacity=".85"/>
  <path d="M6 114C6 114 -6 102 -10 88" stroke="#B8873D" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
</svg>`;

document.querySelectorAll('.corner-flourish').forEach(el => { el.innerHTML = FLOURISH; });
document.getElementById('floralLeft').innerHTML = FLOURISH;
document.getElementById('floralRight').innerHTML = FLOURISH;

// ---- 1. Swipe hacia arriba ----
const inicio = document.getElementById('inicio');
const swipeFrame = document.getElementById('swipeFrame');
const fraseInicio2 = document.getElementById('fraseInicio2');
const swipeHint = document.getElementById('swipeHint');

const THRESHOLD = -90;
let dragging = false;
let startY = 0;
let currentTranslate = 0;
let finished = false;

document.addEventListener('touchmove', (e) => {
  if (document.body.classList.contains('locked')) e.preventDefault();
}, { passive:false });

document.addEventListener('wheel', (e) => {
  if (document.body.classList.contains('locked')) e.preventDefault();
}, { passive:false });

function onDragStart(e){
  if (finished) return;
  dragging = true;
  startY = e.touches ? e.touches[0].clientY : e.clientY;
  swipeFrame.style.transition = 'none';
}

function onDragMove(e){
  if (!dragging || finished) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  let delta = y - startY;
  if (delta > 0) delta = 0;
  currentTranslate = Math.max(delta, -220);
  swipeFrame.style.transform = `translateY(${currentTranslate}px)`;
  const progress = Math.min(1, Math.abs(currentTranslate) / Math.abs(THRESHOLD));
  fraseInicio2.style.opacity = progress;
  swipeHint.style.opacity = 1 - progress * 0.8;
}

function onDragEnd(){
  if (!dragging || finished) return;
  dragging = false;
  swipeFrame.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease';

  if (currentTranslate <= THRESHOLD){
    finished = true;
    swipeFrame.style.transform = 'translateY(-460px)';
    swipeFrame.style.opacity = '0';
    inicio.classList.add('done');
    document.body.classList.remove('locked');
    setTimeout(() => {
      document.getElementById('album').scrollIntoView({ behavior:'smooth' });
    }, 550);
  } else {
    swipeFrame.style.transform = 'translateY(0)';
    currentTranslate = 0;
    fraseInicio2.style.opacity = 0;
    swipeHint.style.opacity = 1;
  }
}

swipeFrame.addEventListener('mousedown', onDragStart);
window.addEventListener('mousemove', onDragMove);
window.addEventListener('mouseup', onDragEnd);
swipeFrame.addEventListener('touchstart', onDragStart, { passive:true });
swipeFrame.addEventListener('touchmove', onDragMove, { passive:true });
swipeFrame.addEventListener('touchend', onDragEnd);

// ---- 2. Carrusel ----
const track = document.getElementById('carouselTrack');
const dotsWrap = document.getElementById('carouselDots');
let current = 0;

CONFIG.fotos.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = `Foto ${i + 1}`;
  track.appendChild(img);

  const dot = document.createElement('span');
  if (i === 0) dot.classList.add('active');
  dotsWrap.appendChild(dot);
});

function goToSlide(index){
  const total = CONFIG.fotos.length;
  current = (index + total) % total;
  track.style.transform = `translateX(-${current * 100}%)`;
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === current));
}

document.getElementById('carPrev').addEventListener('click', () => goToSlide(current - 1));
document.getElementById('carNext').addEventListener('click', () => goToSlide(current + 1));

let touchStartX = null;
track.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
track.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 40) goToSlide(current + (diff < 0 ? 1 : -1));
  touchStartX = null;
});

// ---- 3. Marco floral ----
const floralFrame = document.getElementById('floralFrame');
floralFrame.addEventListener('click', () => {
  floralFrame.classList.toggle('open');
});

// ---- 4. Guardar recuerdo ----
const saveBtn = document.getElementById('saveBtn');
const toast = document.getElementById('toast');

saveBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(window.location.href);
  }catch(err){
    const temp = document.createElement('input');
    temp.value = window.location.href;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
  }
  saveBtn.textContent = '¡Enlace copiado!';
  saveBtn.classList.add('saved');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
  setTimeout(() => {
    saveBtn.textContent = 'Guardar este recuerdo';
    saveBtn.classList.remove('saved');
  }, 2500);
});
</script>
</body>
</html>
