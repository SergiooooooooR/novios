<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Sorpresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=EB+Garamond:wght@400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E6;
    --paper:#F3E6C9;
    --paper-dark:#E7D6AC;
    --blush:#F0D7C9;
    --rosewood:#A8324A;
    --rosewood-dark:#8A2740;
    --plum-ink:#4A2E35;
    --gold:#B9925A;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body.locked{
    overflow:hidden;
    height:100vh;
  }

  body{
    background:var(--cream);
    color:var(--plum-ink);
    font-family:'EB Garamond', serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2,h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    line-height:1.15;
  }

  .signature{
    font-family:'Parisienne', cursive;
    font-weight:400;
  }

  section{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    text-align:center;
  }

  /* ---------- INICIO ---------- */
  #inicio{
    background:
      radial-gradient(circle at 50% 20%, rgba(255,255,255,.5), transparent 60%),
      var(--blush);
    position:relative;
  }

  #inicio h1{
    font-size:clamp(22px, 6vw, 40px);
    font-style:italic;
    max-width:320px;
    margin-bottom:56px;
    color:var(--rosewood-dark);
  }

  .heart-wrap{
    position:relative;
    width:140px;
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  .heart-wrap svg{
    width:100px;
    height:100px;
    transition:transform .12s ease;
    filter:drop-shadow(0 6px 14px rgba(168,50,74,.35));
  }

  .heart-wrap:active svg{ transform:scale(.88); }

  .heart-wrap.pulse svg{ animation:pulse .28s ease; }
  @keyframes pulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  .progress-track{
    width:min(280px, 80vw);
    height:14px;
    border-radius:999px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(168,50,74,.25);
    margin-top:40px;
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--rosewood), var(--rosewood-dark));
    border-radius:999px;
    transition:width .18s ease;
  }

  .progress-label{
    margin-top:14px;
    font-size:14px;
    letter-spacing:.02em;
    color:var(--rosewood-dark);
    opacity:.85;
  }

  .float-heart{
    position:absolute;
    pointer-events:none;
    font-size:20px;
    color:var(--rosewood);
    opacity:0;
    animation:floatUp 1s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(0,0) scale(.6); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translate(var(--dx), -120px) scale(1.1); }
  }

  #inicio.done .heart-wrap,
  #inicio.done .progress-track,
  #inicio.done .progress-label{ opacity:0; pointer-events:none; }
  #inicio.done .heart-wrap,
  #inicio.done .progress-track,
  #inicio.done .progress-label{ transition:opacity .5s ease; }

  /* ---------- DETALLE ---------- */
  #detalle{ background:var(--cream); }

  .eyebrow-note{
    font-size:22px;
    font-style:italic;
    color:var(--rosewood-dark);
    max-width:340px;
    margin-bottom:28px;
  }

  .carousel{
    position:relative;
    width:min(320px, 84vw);
    aspect-ratio:4/5;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(74,46,53,.22);
    border:6px solid #fff;
  }

  .carousel-track{
    display:flex;
    height:100%;
    transition:transform .4s cubic-bezier(.65,0,.35,1);
  }

  .carousel-track img{
    width:100%;
    height:100%;
    object-fit:cover;
    flex:0 0 100%;
  }

  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    border:none;
    color:var(--rosewood-dark);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .carousel-arrow.prev{ left:10px; }
  .carousel-arrow.next{ right:10px; }

  .carousel-dots{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .carousel-dots span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--paper-dark);
    transition:background .2s ease, transform .2s ease;
  }
  .carousel-dots span.active{
    background:var(--rosewood);
    transform:scale(1.25);
  }

  .detalle-intro{
    max-width:360px;
    margin-top:28px;
    font-size:19px;
  }

  .scroll-hint{
    margin-top:44px;
    font-size:14px;
    color:var(--rosewood-dark);
    opacity:.75;
  }

  /* ---------- CARTA ---------- */
  #carta{
    background:var(--blush);
  }

  .envelope-wrap{
    width:min(300px, 80vw);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:1;
    max-height:400px;
    overflow:hidden;
    transition:opacity .35s ease, max-height .5s ease .15s, margin .5s ease .15s;
  }

  .envelope-wrap.open{
    opacity:0;
    max-height:0;
    margin:0;
    pointer-events:none;
  }

  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
  }

  .envelope-body{
    position:absolute;
    inset:0;
    background:var(--paper);
    border:1px solid var(--paper-dark);
    border-radius:4px;
    box-shadow:0 14px 30px rgba(74,46,53,.2);
  }

  .envelope-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    background:var(--paper-dark);
    clip-path:polygon(0 0, 100% 0, 50% 85%);
    transform-origin:top;
    transition:transform .5s ease;
    z-index:3;
  }

  .envelope-wrap.open .envelope-flap{
    transform:rotateX(180deg);
  }

  .envelope-heart{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:22px;
    color:var(--rosewood);
    z-index:4;
    transition:opacity .2s ease;
  }
  .envelope-wrap.open .envelope-heart{ opacity:0; }

  .envelope-caption{
    margin-top:20px;
    font-size:21px;
    font-style:italic;
    color:var(--rosewood-dark);
  }

  .letter{
    max-width:360px;
    margin-top:32px;
    background:var(--paper);
    border:1px solid var(--paper-dark);
    border-radius:4px;
    padding:36px 28px;
    box-shadow:0 16px 34px rgba(74,46,53,.18);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .5s ease, max-height .6s ease, padding .6s ease, margin .6s ease;
  }

  .letter.visible{
    opacity:1;
    max-height:600px;
    margin-top:32px;
  }

  .letter h3{
    font-size:24px;
    font-style:italic;
    color:var(--rosewood-dark);
    margin-bottom:18px;
  }

  .letter p{
    font-size:18px;
    margin-bottom:14px;
  }

  .letter .signature{
    font-size:28px;
    color:var(--rosewood);
    margin-top:10px;
  }

  /* ---------- CIERRE ---------- */
  #cierre{ background:var(--cream); }

  .cierre-photo{
    width:min(280px, 78vw);
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:6px;
    border:6px solid #fff;
    box-shadow:0 18px 40px rgba(74,46,53,.22);
  }

  .cierre-note{
    max-width:340px;
    margin-top:26px;
    font-size:18px;
  }

  .cierre-farewell{
    margin-top:18px;
    font-size:20px;
    font-style:italic;
    color:var(--rosewood-dark);
  }

  .save-btn{
    margin-top:36px;
    background:var(--rosewood);
    color:#fff;
    border:none;
    padding:14px 34px;
    border-radius:999px;
    font-family:'EB Garamond', serif;
    font-size:17px;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(168,50,74,.35);
    transition:transform .15s ease, background .2s ease;
  }
  .save-btn:active{ transform:scale(.96); }
  .save-btn.saved{ background:var(--rosewood-dark); }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--plum-ink);
    color:var(--cream);
    padding:10px 22px;
    border-radius:999px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body class="locked">

  <!-- ============ 1. INICIO ============ -->
  <section id="inicio">
    <h1>Presiona el corazón 4 veces… <br> Hay una pequeña sorpresa esperando por ti. ❤️</h1>
    <div class="heart-wrap" id="heartWrap">
      <svg viewBox="0 0 32 29" fill="var(--rosewood)">
        <path d="M23.6 0c-3 0-5.9 1.6-7.6 4.3C14.3 1.6 11.4 0 8.4 0 3.8 0 0 3.8 0 8.4c0 8.3 10.6 14.7 15.2 18.7.5.4 1.1.4 1.6 0C21.4 23.1 32 16.7 32 8.4 32 3.8 28.2 0 23.6 0z"/>
      </svg>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">0 / 60</div>
  </section>

  <!-- ============ 2. DETALLE ============ -->
  <section id="detalle">
    <p class="eyebrow-note" id="introText"></p>
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow prev" id="carPrev">‹</button>
      <button class="carousel-arrow next" id="carNext">›</button>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
    <p class="detalle-intro" id="coupleIntro"></p>
    <p class="scroll-hint">Sigue bajando ↓</p>
  </section>

  <!-- ============ 3. CARTA ============ -->
  <section id="carta">
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-heart">♥</div>
        <div class="envelope-flap"></div>
      </div>
      <p class="envelope-caption">Presiona la carta para descubrir lo que tengo que decirte. 💌</p>
    </div>
    <div class="letter" id="letter">
      <h3 id="letterTitle"></h3>
      <div id="letterBody"></div>
      <p class="signature" id="letterSignature"></p>
    </div>
  </section>

  <!-- ============ 4. CIERRE ============ -->
  <section id="cierre">
    <img class="cierre-photo" id="cierreFoto" src="" alt="Foto importante">
    <p class="cierre-note" id="cierreTexto"></p>
    <p class="cierre-farewell" id="cierreDespedida"></p>
    <button class="save-btn" id="saveBtn">Guardar este recuerdo</button>
  </section>

  <div class="toast" id="toast">Enlace copiado</div>

<script>
/* =========================================================
   CONFIGURA AQUÍ LOS DATOS DE CADA PAREJA
   (esta es la única sección que cambia por cliente)
   ========================================================= */


   if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}
window.scrollTo(0, 0);
window.addEventListener('load', () => window.scrollTo(0, 0));
window.addEventListener('pageshow', () => window.scrollTo(0, 0));


const CONFIG = {
  // El progreso avanza en 4 pasos fijos: 0% -> 33% -> 66% -> 100%
  progressSteps: [0, 25, 50, 75, 100],

  intro: "Esta sorpresa es para ti, disfrútala con calma.❤️", 

  coupleIntro: "Dos personas, una historia que sigue escribiéndose cada día.",

  fotos: [
    "img/5.JPG",
    "img/2.JPG",
    "img/3.JPG",
    "img/4.JPG"
  ],

  cartaTitulo: "Para ti, mi amor ❤️",
  cartaParrafos: [
    "Cada día a tu lado se convierte en una aventura que no cambiaría por nada.",
    "Gracias por ser mi compañera, por llenar mis días de momentos hermosos, por inspirarme a ser mejor y, sobre todo, por convertirte en mi lugar favorito en este mundo.",
    "Si pudiera volver al día en que nuestras historias se cruzaron, te elegiría una y otra vez."
  ],
  cartaFirma: "Con todo mi amor, para ti. ❤",

  cierreFoto: "img/6.JPG",
  cierreTexto: "Y esto apenas es una pequeña parte… Espero que hayas disfrutado este momento tanto como yo disfruté preparándolo para ti.",
  cierreDespedida: "Con todo mi amor, una pequeña muestra de nuestra historia.❤️"
};

/* =========================================================
   LÓGICA — no necesitas tocar nada de aquí para abajo
   ========================================================= */

// ---- Textos dinámicos ----
document.getElementById('introText').textContent = CONFIG.intro;
document.getElementById('coupleIntro').textContent = CONFIG.coupleIntro;
document.getElementById('letterTitle').textContent = CONFIG.cartaTitulo;
document.getElementById('letterBody').innerHTML =
  CONFIG.cartaParrafos.map(p => `<p>${p}</p>`).join('');
document.getElementById('letterSignature').textContent = CONFIG.cartaFirma;
document.getElementById('cierreFoto').src = CONFIG.cierreFoto;
document.getElementById('cierreTexto').textContent = CONFIG.cierreTexto;
document.getElementById('cierreDespedida').textContent = CONFIG.cierreDespedida;
document.getElementById('progressLabel').textContent = `${CONFIG.progressSteps[0]}%`;

// ---- 1. Corazón + barra de progreso ----
const inicio = document.getElementById('inicio');
const heartWrap = document.getElementById('heartWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

let clicks = 0;
let finished = false;

// Bloquea cualquier intento de scroll (touch, rueda del mouse) mientras
// no se haya completado la barra de progreso del inicio.
document.addEventListener('touchmove', (e) => {
  if (document.body.classList.contains('locked')) e.preventDefault();
}, { passive:false });

document.addEventListener('wheel', (e) => {
  if (document.body.classList.contains('locked')) e.preventDefault();
}, { passive:false });

function spawnFloatingHeart(x, y){
  const h = document.createElement('span');
  h.className = 'float-heart';
  h.textContent = '♥';
  h.style.left = x + 'px';
  h.style.top = y + 'px';
  h.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
  inicio.appendChild(h);
  setTimeout(() => h.remove(), 1000);
}

heartWrap.addEventListener('click', (e) => {
  if (finished) return;
  const lastStep = CONFIG.progressSteps.length - 1;
  clicks = Math.min(clicks + 1, lastStep);

  const pct = CONFIG.progressSteps[clicks];
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${pct}%`;

  heartWrap.classList.remove('pulse');
  void heartWrap.offsetWidth; // reinicia animación
  heartWrap.classList.add('pulse');

  const rect = heartWrap.getBoundingClientRect();
  spawnFloatingHeart(rect.left + rect.width/2 - inicio.getBoundingClientRect().left,
                      rect.top - inicio.getBoundingClientRect().top);

  if (clicks >= lastStep){
    finished = true;
    inicio.classList.add('done');
    document.body.classList.remove('locked');
    setTimeout(() => {
      document.getElementById('detalle').scrollIntoView({ behavior:'smooth' });
    }, 600);
  }
});

// ---- 2. Carrusel ----
const track = document.getElementById('carouselTrack');
const dotsWrap = document.getElementById('carouselDots');
let current = 0;

CONFIG.fotos.forEach((src, i) => {
  const img = document.createElement('img');
  img.src = src;
  img.alt = `Foto ${i + 1}`;
  track.appendChild(img);

  const dot = document.createElement('span');
  if (i === 0) dot.classList.add('active');
  dotsWrap.appendChild(dot);
});

function goToSlide(index){
  const total = CONFIG.fotos.length;
  current = (index + total) % total;
  track.style.transform = `translateX(-${current * 100}%)`;
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === current));
}

document.getElementById('carPrev').addEventListener('click', () => goToSlide(current - 1));
document.getElementById('carNext').addEventListener('click', () => goToSlide(current + 1));

// swipe táctil simple
let touchStartX = null;
track.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
track.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 40) goToSlide(current + (diff < 0 ? 1 : -1));
  touchStartX = null;
});

// ---- 3. Carta / sobre ----
const envelopeWrap = document.getElementById('envelopeWrap');
const letter = document.getElementById('letter');

envelopeWrap.addEventListener('click', () => {
  const opening = !envelopeWrap.classList.contains('open');
  envelopeWrap.classList.toggle('open');
  if (opening){
    setTimeout(() => letter.classList.add('visible'), 350);
  } else {
    letter.classList.remove('visible');
  }
});

// ---- 4. Guardar recuerdo ----
const saveBtn = document.getElementById('saveBtn');
const toast = document.getElementById('toast');

saveBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(window.location.href);
  }catch(err){
    // fallback si el navegador bloquea el clipboard
    const temp = document.createElement('input');
    temp.value = window.location.href;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
  }
  saveBtn.textContent = '¡Enlace copiado!';
  saveBtn.classList.add('saved');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
  setTimeout(() => {
    saveBtn.textContent = 'Guardar este recuerdo';
    saveBtn.classList.remove('saved');
  }, 2500);
});
</script>
</body>
</html>
